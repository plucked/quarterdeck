[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "Unlicense"
publish = false

[workspace.dependencies]
# internal
qd-cache = { path = "crates/cache" }
qd-claude = { path = "crates/claude" }
qd-diff = { path = "crates/diff" }
qd-file-tree = { path = "crates/file_tree" }
qd-github = { path = "crates/github" }
qd-markdown = { path = "crates/markdown" }
qd-studio = { path = "crates/studio" }
qd-syntax = { path = "crates/syntax" }
qd-update = { path = "crates/update" }
qd-video = { path = "crates/video" }

# external
anyhow = "1"
base64 = "0.22"
dirs = "7"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false }
nix = { version = "0.31", features = ["poll", "signal", "socket", "user"] }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL", "NSValue", "objc2-core-foundation"] }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
socket2 = "0.6"
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
thiserror = "2"
tempfile = "3"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "3", features = ["json"] }
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.dev.package."*"]
opt-level = 2
