[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
qd-cache = { path = "crates/cache" }
qd-diff = { path = "crates/diff" }
qd-file-tree = { path = "crates/file_tree" }
qd-github = { path = "crates/github" }
qd-markdown = { path = "crates/markdown" }
qd-syntax = { path = "crates/syntax" }

# external
anyhow = "1"
dirs = "7"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
thiserror = "2"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "3", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.dev.package."*"]
opt-level = 2
