# Rebuild-and-relaunch loop: `bacon` (default job `app`) rebuilds on save and
# restarts the app; the UI snapshot restores what was open.
# Jobs not defined here (check, clippy, test, ...) come from bacon's defaults.

default_job = "app"

# The app runs from a dev bundle (target/debug/Quarterdeck.app), so macOS
# shows its icon and name; it keeps this terminal's environment (token, gh).
[jobs.app]
command = [
    "sh", "-c",
    "packaging/macos/bundle.sh --dev && exec target/debug/Quarterdeck.app/Contents/MacOS/Quarterdeck",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

# Like `app`, with the brief gallery opened at launch: `bacon gallery` to
# work on how briefs look, the gallery coming back after every rebuild.
[jobs.gallery]
command = [
    "sh", "-c",
    "packaging/macos/bundle.sh --dev && QUARTERDECK_BRIEF_GALLERY=1 exec target/debug/Quarterdeck.app/Contents/MacOS/Quarterdeck",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[jobs.clippy-strict]
# `-D warnings` fails on our warnings; allow_warnings ignores upstream future-incompat notes.
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false
allow_warnings = true

[keybindings]
r = "job:app"
g = "job:gallery"
c = "job:clippy-strict"
